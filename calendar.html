<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BioLab Hub booking calendar: Room A, AKTA and PCR.">
<title>Booking calendar · BioLab Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 2c0 8 14 8 14 14s-14 6-14 14M23 2c0 8-14 8-14 14s14 6 14 14"/><path d="M11 8h10M12 24h8" stroke-width="1.8"/></svg>
    <h1>BioLab Hub</h1>
  </div>
  <nav aria-label="Main"><a href="index.html#home">Home</a><a href="index.html#db">Database</a><a href="calendar.html" class="cur">Calendar</a></nav>
  <span class="who" id="who"></span>
</header>

<main>
  <h2>Booking calendar</h2>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="note" id="info" style="margin-top:8px"></p>
  <div class="monthbar">
    <button id="prev" aria-label="Previous month">&lt;</button>
    <h2 id="title"></h2>
    <button id="next" aria-label="Next month">&gt;</button>
    <button id="todayBtn">Today</button>
  </div>
  <div class="cal" id="wrap"><table>
    <thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead>
    <tbody id="cal"></tbody>
  </table></div>
  <h2>Upcoming bookings</h2>
  <ul class="up" id="up"></ul>
</main>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <div id="timeRow" hidden>
    <label for="tStart">From</label>
    <select id="tStart"></select>
    <label for="tEnd">To</label>
    <select id="tEnd"></select>
    <p class="note" id="taken"></p>
  </div>
  <p class="note" id="asWho"></p>
  <label for="note">Note (optional)</label>
  <input id="note" type="text" maxlength="80" placeholder="e.g. column, samples, protocol">
  <div class="err" id="err"></div>
  <div class="row"><span class="sp"></span><button id="cancel">Cancel</button><button id="ok" class="primary">Confirm</button></div>
</dialog>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SLOTS=[{id:'m',label:'8–13',full:'8:00–13:00'},{id:'d',label:'13–17',full:'13:00–17:00'},{id:'e',label:'17–22',full:'17:00–22:00'}];
const RES={
  room:{name:'Room A',info:'Choose the start and end time. Hours that are already taken cannot be selected.',slots:[]},
  akta:{name:'AKTA',info:'Three slots a day: 8:00–13:00, 13:00–17:00 and 17:00–22:00.',slots:SLOTS},
  pcr:{name:'PCR',info:'Three slots a day: 8:00–13:00, 13:00–17:00 and 17:00–22:00.',slots:SLOTS}
};
const $=id=>document.getElementById(id);
const iso=(Y,M,D)=>Y+'-'+String(M+1).padStart(2,'0')+'-'+String(D).padStart(2,'0');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

/* ===== Room A: booking by time range (08:00-22:00, 30-minute steps) ===== */
const T0=8*60,T1=22*60,STEP=30;
const hm=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const rangeText=r=>hm(r[0])+'–'+hm(r[1]);
function roomRange(id){if(id==='day')return[T0,T1];const[a,b]=id.split('-');return[+a.slice(0,2)*60+ +a.slice(2),+b.slice(0,2)*60+ +b.slice(2)]}
const blockFree=(list,t)=>!list.some(x=>x.r[0]<t+STEP&&x.r[1]>t);   // is [t, t+30 min) free?
const hasFree=list=>{for(let t=T0;t<T1;t+=STEP)if(blockFree(list,t))return true;return false};
function roomBookings(date){return Object.keys(B).filter(k=>k.startsWith('room|'+date+'|')).map(k=>({key:k,r:roomRange(k.split('|')[2]),b:B[k]})).sort((a,b)=>a.r[0]-b.r[0])}

/* ===== Data comes from the server (app.py); the server decides who may book or cancel ===== */
async function api(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'biolab'},body:body===undefined?undefined:JSON.stringify(body)});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error)||('Server error ('+r.status+')'));e.status=r.status;throw e}
  return d;
}
let ME=null,ADMIN=false,B={};
async function loadBookings(){B=(await api('GET','/api/bookings')).bookings}

const now=new Date(),todayKey=iso(now.getFullYear(),now.getMonth(),now.getDate());
let y=now.getFullYear(),m=now.getMonth(),res='room',pending=null;

function render(){
  const t=$('tabs');t.innerHTML='';
  for(const id in RES){const b=el('button','',RES[id].name);b.setAttribute('role','tab');b.setAttribute('aria-selected',id===res);b.onclick=()=>{res=id;render()};t.appendChild(b)}
  $('info').textContent=RES[res].info;
  $('title').textContent=MONTHS[m]+' '+y;
  const isRoom=res==='room',multi=isRoom||RES[res].slots.length>1;$('wrap').className='cal'+(multi?' multi':'');
  const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const cells=Math.ceil((first+days)/7)*7,tb=$('cal');tb.innerHTML='';
  let tr;
  for(let i=0;i<cells;i++){
    if(i%7===0){tr=document.createElement('tr');tb.appendChild(tr)}
    const td=document.createElement('td'),d=i-first+1;
    if(d<1||d>days){td.className='off';tr.appendChild(td);continue}
    const date=iso(y,m,d),past=date<todayKey;
    td.className=(date===todayKey?'today ':'')+(past?'past':'');
    td.appendChild(el('div','n',date===todayKey?'Today '+d:String(d)));
    if(isRoom){
      const list=roomBookings(date),tl=el('div','tl');
      list.forEach(x=>{const sp=document.createElement('span');sp.style.left=((x.r[0]-T0)/(T1-T0)*100)+'%';sp.style.width=((x.r[1]-x.r[0])/(T1-T0)*100)+'%';tl.appendChild(sp)});
      td.appendChild(tl);
      list.forEach(x=>{
        const mine=ADMIN||x.b.by===ME.id,btn=el('button','slot two busy');
        btn.append(el('span','t',rangeText(x.r)),el('span','w',x.b.n));
        btn.disabled=past||!mine;
        btn.title=x.b.n+(x.b.c?' — '+x.b.c:'')+(mine?'. Click to cancel':'. Only the person who booked it or an admin can cancel');
        btn.onclick=()=>cancelBooking(x.key,MONTHS[m]+' '+d+', '+rangeText(x.r));
        td.appendChild(btn);
      });
      const full=!hasFree(list),add=el('button','slot full',full?'Fully booked':'+ Book time');
      add.disabled=past||full;add.onclick=()=>openRoomDlg(date,d);
      td.appendChild(add);
    }else for(const s of RES[res].slots){
      const key=res+'|'+date+'|'+s.id,b=B[key],mine=b&&(ADMIN||b.by===ME.id);
      const btn=el('button','slot'+(b?' busy':'')+(multi?'':' full'));
      btn.disabled=past||(b&&!mine);
      if(multi){btn.append(el('span','t',s.label),el('span','w',b?b.n:'free'))}
      else btn.textContent=b?'Booked: '+b.n:'Book';
      btn.title=b?(b.n+(b.c?' — '+b.c:'')+(mine?'. Click to cancel':'. Only the person who booked it or an admin can cancel')):'Book '+s.full;
      btn.onclick=()=>b?cancelBooking(key,MONTHS[m]+' '+d+', '+s.full):openDlg(key,d,s);
      td.appendChild(btn);
    }
    tr.appendChild(td);
  }
  upcoming();
}
function upcoming(){
  const ul=$('up');ul.innerHTML='';
  const rows=Object.keys(B).filter(k=>k.startsWith(res+'|')&&k.split('|')[1]>=todayKey).sort().slice(0,8);
  if(!rows.length){ul.appendChild(el('li','muted','No bookings yet.'));return}
  for(const k of rows){
    const[,date,sid]=k.split('|'),b=B[k],p=date.split('-');
    const when=res==='room'?rangeText(roomRange(sid)):RES[res].slots.find(x=>x.id===sid).full;
    ul.appendChild(el('li','',MONTHS[+p[1]-1]+' '+(+p[2])+', '+when+' — '+b.n+(b.c?' ('+b.c+')':'')));
  }
}
function openDlg(key,d,s){
  pending={key};$('timeRow').hidden=true;
  $('dlgTitle').textContent=RES[res].name+': '+MONTHS[m]+' '+d+', '+s.full;
  $('err').textContent='';$('note').value='';
  $('asWho').textContent='Booking as '+ME.name;
  $('dlg').showModal();$('note').focus();
}
function openRoomDlg(date,d){
  pending={room:true,date};$('timeRow').hidden=false;
  $('dlgTitle').textContent='Room A: '+MONTHS[m]+' '+d;
  $('err').textContent='';$('note').value='';
  $('asWho').textContent='Booking as '+ME.name;
  fillTimes(date);
  $('dlg').showModal();$('tStart').focus();
}
function fillTimes(date){
  const list=roomBookings(date),sSel=$('tStart'),n=new Date(),nowMin=date===todayKey?n.getHours()*60+n.getMinutes():-1;
  sSel.innerHTML='';
  for(let t=T0;t<T1;t+=STEP)if(t>=nowMin&&blockFree(list,t))sSel.append(new Option(hm(t),t));
  sSel.onchange=()=>fillEnd(list);
  fillEnd(list);
  $('taken').textContent=list.length?'Already booked: '+list.map(x=>rangeText(x.r)+' ('+x.b.n+')').join(', ')+'. These hours cannot be selected.':'No bookings on this day yet.';
}
function fillEnd(list){
  const s=+$('tStart').value,eSel=$('tEnd');eSel.innerHTML='';
  const lim=Math.min(T1,...list.map(x=>x.r[0]).filter(v=>v>s));
  for(let t=s+STEP;t<=lim;t+=STEP)eSel.append(new Option(hm(t),t));
  eSel.value=String(Math.min(s+60,lim));
}
async function cancelBooking(key,label){
  if(!confirm('Cancel booking: '+RES[res].name+', '+label+'?'))return;
  try{await api('POST','/api/bookings/cancel',{key});await loadBookings();render()}
  catch(e){alert(e.message);try{await loadBookings();render()}catch(x){}}
}
async function confirmBooking(){
  let key;
  if(pending.room){
    const s=+$('tStart').value,e=+$('tEnd').value;
    if(!(e>s)){$('err').textContent='Please choose a start and an end time.';return}
    key='room|'+pending.date+'|'+hm(s).replace(':','')+'-'+hm(e).replace(':','');
  }else key=pending.key;
  $('ok').disabled=true;
  try{
    await api('POST','/api/bookings',{key,note:$('note').value.trim()});
    await loadBookings();$('dlg').close();render();
  }catch(e){
    $('err').textContent=e.message;
    if(e.status===409||e.status===400){try{await loadBookings();if(pending.room)fillTimes(pending.date);render()}catch(x){}}
  }
  $('ok').disabled=false;
}
$('ok').onclick=confirmBooking;
$('cancel').onclick=()=>$('dlg').close();
$('dlg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')confirmBooking()});
$('prev').onclick=()=>{m--;if(m<0){m=11;y--}render()};
$('next').onclick=()=>{m++;if(m>11){m=0;y++}render()};
$('todayBtn').onclick=()=>{y=now.getFullYear();m=now.getMonth();render()};

function gate(msg){
  const m=document.querySelector('main');m.innerHTML='';
  const a=el('a','','Go to the home page');a.href='index.html#home';
  m.append(el('h2','','Booking calendar'),el('p','',msg),a);
}
async function poll(){
  if(document.hidden)return;
  try{const before=JSON.stringify(B);await loadBookings();if(JSON.stringify(B)!==before)render()}catch(e){}
}
(async()=>{
  try{
    const m=await api('GET','/api/me');
    if(!m.id)return gate('Please sign in on the home page first.');
    if(m.status!=='approved')return gate('An administrator has to approve your account before you can book.');
    ME=m;ADMIN=m.role==='admin';
    $('who').textContent=m.name+' · '+(ADMIN?'Administrator':'Member');
    await loadBookings();render();
    setInterval(poll,12000);
  }catch(e){gate('Could not reach the server. Please try again.')}
})();
</script>
</body>
</html>
