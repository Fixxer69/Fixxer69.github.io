<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BioLab Hub: instrument booking and the chemicals and buffers inventory of the laboratory.">
<title>BioLab Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 2c0 8 14 8 14 14s-14 6-14 14M23 2c0 8-14 8-14 14s14 6 14 14"/><path d="M11 8h10M12 24h8" stroke-width="1.8"/></svg>
    <h1>BioLab Hub</h1>
  </div>
  <nav id="nav" aria-label="Main"></nav>
  <span class="who" id="who"></span>
</header>
<main id="main"></main>

<dialog id="dlg">
  <h3 id="dt"></h3>
  <div id="fields"></div>
  <div class="err" id="err"></div>
  <div class="row"><button id="del">Delete</button><button id="fresh">Prepared today</button><span class="sp"></span><button id="cancel">Cancel</button><button id="ok" class="primary">Save</button></div>
</dialog>

<script>
/* ================= CONFIG ================= */
const CALENDAR_URL='calendar.html';   // address of your booking calendar page

const LOC={S1:'Shelf 1',S2:'Shelf 2',S5:'Shelf 5',S6:'Shelf 6',F:'Fridge (4 °C)'};
const SEC={r:'Reagents',s:'Salts & buffers',h:'Hazardous',f:'Fridge'};
const SPEC={
 c:[['n','Name','text'],['a','Amount','text'],['l','Location','sel',LOC],['s','Section','sel',SEC],['d','Hazardous (DANGER)','chk'],['t','Comment','text']],
 b:[['n','Name','text'],['v','Volume','text'],['p','Preparation date','date'],['t','Comment','text']],
 d:[['n','Title','text'],['u','Google Drive link or file path (pdf/name.pdf)','text'],['g','Category','text'],['x','Description','text']]};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
/* Safe storage: browser storage when allowed, otherwise memory (e.g. sandboxed previews). */
const MEMSTORE={};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return k in MEMSTORE?MEMSTORE[k]:null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){MEMSTORE[k]=v}},
  keys(){try{return Object.keys(localStorage)}catch(e){return Object.keys(MEMSTORE)}}
};

/* ================= API (talks to app.py on the same server) ================= */
async function api(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'biolab'},body:body===undefined?undefined:JSON.stringify(body)});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error)||('Server error ('+r.status+')'));e.status=r.status;throw e}
  return d;
}

/* ================= STATE ================= */
let ME={id:null,name:'',admin:false,approved:false,status:null,loaded:false},INV={c:null,b:null,d:null},META={},MEM=[],STALE=false,SIG='';
const S={tab:'c',q:'',sec:'',loc:'',dg:false,att:false,months:12,k:'',dir:1};
const NOW=Date.now();
const route=()=>{const h=location.hash.slice(1);return h==='db'||h==='admin'||h==='docs'?h:'home'};
const canRead=()=>!!ME.id&&(ME.admin||ME.approved);
const edit=()=>route()==='admin'&&ME.admin;
const dstr=t=>t?new Date(t).toLocaleDateString('en-GB'):'—';

/* ================= INVENTORY LOGIC ================= */
const ml=v=>{let s=0,f=false;(v||'').replace(/(\d+(?:[.,]\d+)?)\s*mL/gi,(m,x)=>{s+=parseFloat(x.replace(',','.'));f=true});return f?s:null};
const age=p=>p?(NOW-new Date(p).getTime())/2629800000:null;
const fmt=p=>p?p.split('-').reverse().join('.'):'—';
function issues(b){
  const r=[],a=age(b.p),v=ml(b.v);
  if(a===null)r.push(['g','no date',0]);
  else if(a>=S.months)r.push(['r','expired · '+Math.floor(a)+' mo',1]);
  else if(a>=S.months/2)r.push(['y',Math.floor(a)+' mo',0]);
  else r.push(['ok','fresh',0]);
  if(!b.v)r.push(['y','no volume',1]);
  else if(v!==null&&v<30)r.push(['r','low: '+v+' mL',1]);
  if(/new one|replace/i.test(b.t))r.push(['y','remake',1]);
  return r;
}
const needs=b=>issues(b).some(i=>i[2]);
function filt(){
  const q=S.q.toLowerCase(),m=x=>!q||(x.n+' '+(x.t||'')+' '+(x.g||'')+' '+(x.x||'')).toLowerCase().includes(q);
  if(S.tab==='d')return(INV.d||[]).filter(m);
  if(S.tab==='b')return(INV.b||[]).filter(x=>m(x)&&(!S.att||needs(x)));
  return(INV.c||[]).filter(x=>m(x)&&(!S.sec||x.s===S.sec)&&(!S.loc||x.l===S.loc)&&(!S.dg||x.d));
}
function sorted(rows){
  const k=S.k;if(!k)return rows;
  const val=x=>k==='v'?(ml(x.v)??-1):k==='st'?issues(x).filter(i=>i[2]).length:(x[k]||'');
  return rows.slice().sort((a,b)=>{const A=val(a),B=val(b);
    return(typeof A==='number'?A-B:String(A).localeCompare(String(B),'en',{numeric:true}))*S.dir});
}

/* ================= SHELL ================= */
function renderNav(){
  const n=$('nav');n.innerHTML='';const r=route();
  const a=(href,t,cur)=>{const x=el('a',cur?'cur':'',t);x.href=href;n.appendChild(x)};
  if(canRead()){
    a('#home','Home',r==='home');a('#db','Database',r==='db');a('#docs','Documents',r==='docs');
    if(ME.admin)a('#admin','Admin panel',r==='admin');
    a(CALENDAR_URL,'Calendar',false);
  }else a('#home','Home',true);
  if(ME.id){const o=el('button','','Sign out');o.onclick=logout;n.appendChild(o)}
  $('who').textContent=!ME.loaded?'':!ME.id?'Signed out':ME.name+' · '+(ME.admin?'Administrator':ME.approved?'Member':ME.status==='rejected'?'Declined':'Awaiting approval');
}
function render(){
  renderNav();
  const m=$('main');m.innerHTML='';const r=route();
  if(!ME.loaded)return m.appendChild(el('p','muted',STALE?'Cannot reach the server. Retrying…':'Loading…'));
  if(!ME.id)return authView(m);
  if(!canRead())return pendingView(m);
  if(r==='home')return home(m);
  if(r==='docs')return docsView(m);
  if(r==='admin'&&!ME.admin)return m.appendChild(el('p','','The admin panel is available to administrators only.'));
  panel(m);
}
/* In-page links (#home, #db ...) are handled here, so they also work inside sandboxed previews
   where a plain "#" link would try to navigate the whole frame. */
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#"]');
  if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();
  const t=a.getAttribute('href');
  if(location.hash===t)render();else location.hash=t;
});
addEventListener('hashchange',()=>{S.tab=route()==='admin'?'u':'c';S.k='';S.q='';S.dq='';S.dc='All';render()});

/* ================= HOME + REGISTRATION ================= */
function home(m){
  m.append(el('h2','','Lab resources'),el('p','muted','Book instruments and look up chemicals and buffers in one place.'));
  const g=el('div','cards');
  const c1=el('a','card cal');c1.href=CALENDAR_URL;
  c1.append(el('b','','Booking calendar'),el('span','muted','Room A by the hour, AKTA and PCR slots.'));
  const ok=canRead(),c2=el(ok?'a':'div','card dbc'+(ok?'':' off'));
  if(ok)c2.href='#db';
  c2.append(el('b','','Database'),el('span','muted',ok?'Chemicals, buffers and the shelf map. Read-only.':'Opens after your request is approved.'));
  g.append(c1,c2);
  if(ME.admin){const c3=el('a','card adm');c3.href='#admin';c3.append(el('b','','Admin panel'),el('span','muted','Review requests and edit the database.'));g.appendChild(c3)}
  m.append(g);homeDocs(m);
}
let AUTHTAB='in';
function authView(m){
  m.append(el('h2','','Welcome to BioLab Hub'),el('p','muted','Sign in with your lab account, or create one. New accounts are approved by an administrator.'));
  const box=el('div','box'),tabs=el('div','tabs');
  [['in','Sign in'],['up','Create account']].forEach(([k,l])=>{const b=el('button','',l);b.setAttribute('aria-selected',AUTHTAB===k);b.onclick=()=>{AUTHTAB=k;render()};tabs.appendChild(b)});
  const f=el('div','fm'),e=el('div','err');
  const fld=(id,label,type,max,ac)=>{const lb=el('label','',label);lb.htmlFor=id;const i=el('input');i.type=type;i.id=id;i.maxLength=max;i.autocomplete=ac;f.append(lb,i);return i};
  const un=fld('a_user','Username','text',32,'username'),pw=fld('a_pass','Password'+(AUTHTAB==='up'?' (at least 8 characters)':''),'password',128,AUTHTAB==='in'?'current-password':'new-password');
  let nm,gr,nt;
  if(AUTHTAB==='up'){nm=fld('a_name','Full name','text',60,'name');gr=fld('a_grp','Group or lab','text',80,'organization');nt=fld('a_note','Comment (optional)','text',200,'off')}
  const s=el('button','primary',AUTHTAB==='in'?'Sign in':'Create account');s.type='button';
  f.append(e,s);
  const go=async()=>{
    const body={username:un.value.trim(),password:pw.value};
    if(!body.username||!body.password){e.textContent='Please enter your username and password.';return}
    if(AUTHTAB==='up'){Object.assign(body,{name:nm.value.trim(),grp:gr.value.trim(),note:nt.value.trim()});if(!body.name||!body.grp){e.textContent='Please fill in your name and group.';return}}
    s.disabled=true;
    try{await api('POST',AUTHTAB==='in'?'/api/login':'/api/register',body);await refresh(true)}
    catch(x){e.textContent=x.message;s.disabled=false}
  };
  s.onclick=go;f.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.tagName==='INPUT')go()});
  box.append(f);m.append(tabs,box);
}
function pendingView(m){
  const declined=ME.status==='rejected';
  m.appendChild(el('h2','',declined?'Account not approved':'Waiting for approval'));
  m.appendChild(el('div','box',declined?'Your account request was declined. Please contact the lab administrator.':'Thank you, '+ME.name+'. An administrator has to approve your account before you can use the site. This page updates by itself.'));
}

/* ================= DATABASE + ADMIN PANEL ================= */
function panel(m){
  const ed=edit();
  m.append(el('h2','',ed?'Admin panel':'Laboratory database'));
  if(ed)m.appendChild(el('p','note','Only administrators can change data. Changes are visible to everyone immediately.'));
  const t=el('div','tabs');t.setAttribute('role','tablist');
  (ed?[['u','Members'],['c','Chemicals'],['b','Buffers'],['d','Documents']]:[['c','Chemicals'],['b','Buffers'],['m','Shelf map']]).forEach(([id,l])=>{
    const b=el('button','',l);b.setAttribute('role','tab');b.setAttribute('aria-selected',S.tab===id);
    b.onclick=()=>{S.tab=id;S.k='';render()};t.appendChild(b)});
  const bar=el('div','bar'),view=el('div','scroll');
  m.append(t,bar,view);
  if(S.tab==='u')return members(view);
  if(INV.c===null||INV.b===null||INV.d===null)return view.appendChild(el('p','muted',STALE?'Data has not loaded yet. Check your connection.':'Loading…'));
  toolbar(bar,ed);body(view,ed);
  const mt=META[S.tab==='b'?'b':S.tab==='d'?'d':'c'];if(mt)m.appendChild(el('p','note','Last database update: '+dstr(mt)));
}
function sel(opts,val,all,fn){const s=document.createElement('select');s.append(new Option(all,''));for(const k in opts)s.append(new Option(opts[k],k));s.value=val;s.onchange=()=>fn(s.value);return s}
function toolbar(bar,ed){
  const re=()=>body($('main').querySelector('.scroll'),ed);
  const q=el('input');q.type='search';q.placeholder='Search by name or comment';q.value=S.q;q.setAttribute('aria-label','Search');
  q.oninput=()=>{S.q=q.value;re()};bar.appendChild(q);
  if(S.tab==='d'){}
  else if(S.tab!=='b'){
    bar.append(sel(SEC,S.sec,'All sections',v=>{S.sec=v;re()}),sel(LOC,S.loc,'All locations',v=>{S.loc=v;re()}));
    const l=el('label'),c=el('input');c.type='checkbox';c.checked=S.dg;c.onchange=()=>{S.dg=c.checked;re()};l.append(c,'Hazardous only');bar.appendChild(l);
  }else{
    const l=el('label'),c=el('input');c.type='checkbox';c.checked=S.att;c.onchange=()=>{S.att=c.checked;re()};l.append(c,'Needs attention');
    const mo=sel({3:'3 months',6:'6 months',12:'12 months',24:'24 months'},String(S.months),'',v=>{S.months=+v||12;re()});mo.options[0].remove();
    const l2=el('label','','Shelf life: ');l2.appendChild(mo);bar.append(l,l2);
  }
  bar.appendChild(el('span','sp'));
  if(ed&&S.tab!=='m'){const a=el('button','primary','+ Add');a.onclick=()=>openDlg(S.tab,null);bar.appendChild(a)}
  if(S.tab!=='d'){const cp=el('button','','Copy CSV');cp.onclick=copyCsv;bar.appendChild(cp)}
  if(ed&&S.tab==='d'&&(INV.d||[]).length){
    const x=el('button','danger','Delete all');
    x.onclick=async()=>{
      if(!confirm('Delete all '+INV.d.length+' documents? This cannot be undone.'))return;
      try{await putDocs([])}catch(err){alert('Could not delete. Please try again.')}
    };
    bar.appendChild(x);
  }
}
function body(v,ed){
  v.innerHTML='';const rows=filt();
  if(S.tab==='m')return mapView(v,rows);
  const cols=S.tab==='d'?[['n','Title'],['g','Category'],['u','Link'],['x','Description']]:S.tab==='c'?[['n','Name'],['a','Amount'],['l','Location'],['s','Section'],['t','Comment']]:[['n','Name'],['v','Volume'],['p','Prepared'],['st','Status'],['t','Comment']];
  const tb=document.createElement('table'),hr=document.createElement('tr');
  cols.forEach(([k,l])=>{const th=el('th','k'+(S.k===k?' s'+(S.dir<0?' d':''):''),l);th.tabIndex=0;
    const go=()=>{S.dir=S.k===k?-S.dir:1;S.k=k;body(v,ed)};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter')go()};hr.appendChild(th)});
  const th=document.createElement('thead');th.appendChild(hr);tb.appendChild(th);
  const bd=document.createElement('tbody');
  sorted(rows).forEach(x=>{
    const tr=document.createElement('tr');
    if(ed){tr.className='ed';tr.tabIndex=0;const o=()=>openDlg(S.tab,x);tr.onclick=o;tr.onkeydown=e=>{if(e.key==='Enter')o()}}
    const td=()=>tr.appendChild(document.createElement('td'));
    const n=td();n.textContent=x.n;if(x.d)n.appendChild(el('span','badge dg','DANGER'));
    if(S.tab==='d'){td().textContent=x.g||'';const di=docInfo(x.u);td().textContent=!di?'invalid link':di.empty?'no file yet':di.local?'on this site: '+x.u:di.open.replace(/^https:\/\//,'').slice(0,42);td().textContent=x.x||''}
    else if(S.tab==='c'){td().textContent=x.a;td().textContent=LOC[x.l]||'';td().textContent=SEC[x.s]||'';td().textContent=x.t}
    else{td().textContent=x.v||'—';td().textContent=fmt(x.p);const s=td();issues(x).forEach(i=>s.appendChild(el('span','badge '+i[0],i[1])));td().textContent=x.t}
    bd.appendChild(tr);
  });
  tb.appendChild(bd);v.appendChild(tb);
  if(!rows.length)v.appendChild(el('p','muted','Nothing found.'));
}
function mapView(v,rows){
  v.classList.add('plain');const g=el('div','map');
  for(const k in LOC){
    const items=rows.filter(x=>x.l===k).sort((a,b)=>a.n.localeCompare(b.n,'en'));
    const sh=el('div','shelf'),ch=el('div','chips');
    items.forEach(x=>{const c=el('span','chip'+(x.d?' dg':''),x.n);c.title=x.n+' — '+x.a;ch.appendChild(c)});
    if(!items.length)ch.appendChild(el('span','muted','empty'));
    sh.append(el('h3','',LOC[k]+' · '+items.length),ch);g.appendChild(sh);
  }
  v.appendChild(g);
}

/* ================= DOCUMENTS ================= */
/* An entry's link is a Google Drive / Docs link, or a PDF kept on this site (e.g. pdf/safety.pdf).
   Embed addresses are rebuilt from validated parts, never copied from the pasted text. */
function docInfo(u){
  u=(u||'').trim();
  if(!u)return{empty:true};
  if(/^(?!.*\.\.)\w[\w ./()-]*\.pdf$/i.test(u)&&!u.includes('//')){
    const p=u.split('/').map(encodeURIComponent).join('/');
    return{open:p,embed:p,local:true};
  }
  let x;try{x=new URL(u)}catch(e){return null}
  if(x.protocol!=='https:')return null;
  if(x.hostname==='drive.google.com'){
    if(/^\/drive\/folders\//.test(x.pathname))return{open:x.href,embed:null};
    const m=x.pathname.match(/\/file\/d\/([\w-]+)/),id=m?m[1]:x.searchParams.get('id');
    if(id&&/^[\w-]+$/.test(id)){
      if(/REPLACE/i.test(id))return{empty:true};
      return{open:'https://drive.google.com/file/d/'+id+'/view',embed:'https://drive.google.com/file/d/'+id+'/preview'};
    }
    return{open:x.href,embed:null};
  }
  if(x.hostname==='docs.google.com'){
    const m=x.pathname.match(/^\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
    if(m)return{open:x.href,embed:'https://docs.google.com/'+m[1]+'/d/'+m[2]+'/preview'};
  }
  return{open:x.href,embed:null};
}
const hasFile=d=>{const i=docInfo(d.u);return !!i&&!i.empty};
const putDocs=async items=>{await api('PUT','/api/inventory/docs',{items});await refresh(true)};
function homeDocs(m){
  if(!canRead())return;
  m.append(el('h2','','Documents'),el('p','muted','Lab PDF files. Pick one to read it right here.'));
  if(!INV.d){m.appendChild(el('p','muted','Loading…'));return}
  const list=INV.d.filter(hasFile);
  if(!list.length){
    m.appendChild(el('p','muted',ME.admin?'No documents yet. Open Documents to add the first one.':'No documents have been added yet.'));
    if(ME.admin){const a=el('a','','Open Documents →');a.href='#docs';m.appendChild(a)}
    return;
  }
  const g=el('div','hdocs');
  list.slice().sort((a,b)=>a.n.localeCompare(b.n,'en')).slice(0,10).forEach(x=>{
    const a=el('a','hdoc');a.href='#docs';
    a.append(el('b','',x.n),el('span','muted',x.g||'General'));
    a.onclick=()=>{S.doc=x.id;store.set('biolab-doc',x.id)};
    g.appendChild(a);
  });
  const all=el('a','',list.length>10?'Browse all '+list.length+' documents →':'Open the document viewer →');all.href='#docs';
  m.append(g,all);
}
function docsView(m){
  if(!INV.d)return m.append(el('h2','','Documents'),el('p','muted',STALE?'Data has not loaded yet. Check your connection.':'Loading…'));
  const list=ME.admin?INV.d:INV.d.filter(hasFile);   // visitors only see entries that already have a file
  m.appendChild(el('h2','','Documents'));
  if(!list.length){
    m.appendChild(el('p','muted',ME.admin?'No documents yet. Add the first one, then attach its PDF.':'No documents have been added yet.'));
    if(ME.admin){const a=el('button','primary','+ Add document');a.onclick=()=>openDlg('d',null);m.appendChild(a)}
    return;
  }
  m.appendChild(el('p','muted',ME.admin?'Pick an entry and add its PDF link, one by one. Entries without a file are visible to you only. Use Delete to remove an entry.':'Choose a file on the left to read it here, or open it in Google Drive. Press / to search.'));
  const wrap=el('div','docs'),side=el('div','doclist'),view=el('div','viewer');
  const q=el('input');q.type='search';q.placeholder='Search documents';q.value=S.dq||'';q.setAttribute('aria-label','Search documents');
  const cats=el('div','cats'),cnt=el('p','note'),ul=el('ul','dlist');
  side.appendChild(q);
  if(ME.admin){const a=el('button','primary addbtn','+ Add document');a.onclick=()=>openDlg('d',null);side.appendChild(a)}
  side.append(cats,cnt,ul);wrap.append(side,view);m.appendChild(wrap);
  function showViewer(){
    view.innerHTML='';
    const d=list.find(x=>x.id===S.doc);
    if(!d){view.appendChild(el('div','vempty','Select a document from the list.'));return}
    const info=docInfo(d.u),head=el('div','vhead');
    head.appendChild(el('h3','',d.n));
    if(info&&!info.empty){const a=el('a','btn',info.local?'Open PDF':'Open in Google Drive');a.href=info.open;a.target='_blank';a.rel='noopener noreferrer';head.appendChild(a)}
    if(ME.admin){
      const e=el('button','','Edit');e.onclick=()=>openDlg('d',d);
      const x=el('button','danger','Delete');
      x.onclick=async()=>{
        if(!confirm('Delete “'+d.n+'”?'))return;
        S.doc=null;store.set('biolab-doc','');
        try{await putDocs(INV.d.filter(y=>y.id!==d.id))}catch(err){alert('Could not delete. Please try again.')}
      };
      head.append(e,x);
    }
    view.appendChild(head);
    if(d.x)view.appendChild(el('p','note',d.x));
    if(!info)view.appendChild(el('p','err','This link is not valid.'));
    else if(info.empty){
      if(!ME.admin){view.appendChild(el('div','vempty','No file has been added to this entry yet.'));return}
      const f=el('div','qadd'),inp=el('input'),btn=el('button','primary','Save link'),er=el('div','err');
      inp.type='text';inp.maxLength=400;inp.placeholder='Google Drive link, or a file path such as pdf/safety.pdf';inp.setAttribute('aria-label','PDF link');
      const go=async()=>{
        const v=inp.value.trim(),i2=docInfo(v);
        if(!v||!i2||i2.empty){er.textContent='Please paste a full https:// link or a file path like pdf/name.pdf.';return}
        btn.disabled=true;
        try{await putDocs(INV.d.map(x=>x.id===d.id?Object.assign({},x,{u:v}):x))}
        catch(e){er.textContent='Could not save. Please try again.';btn.disabled=false}
      };
      btn.onclick=go;inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')go()});
      f.append(el('b','','Add the PDF for this entry'),inp,btn,er,
        el('p','note','Paste a Google Drive share link (the file must be shared as “Anyone with the link can view”). Or put the PDF in the pdf folder next to index.html and type its path, for example pdf/safety.pdf.'));
      view.appendChild(f);
    }else if(info.embed){
      const fr=document.createElement('iframe');fr.src=info.embed;fr.title=d.n;fr.loading='lazy';
      if(!info.local)fr.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
      view.appendChild(fr);
      if(!info.local)view.appendChild(el('p','note','If the preview stays blank, the file must be shared as “Anyone with the link can view”.'));
    }else view.appendChild(el('div','vempty','This link cannot be previewed here. Use the button above to open it.'));
  }
  function showList(){
    const cs=[...new Set(list.map(x=>x.g||'General'))].sort();
    cats.innerHTML='';
    ['All',...cs].forEach(c=>{const b=el('button','chipbtn'+((S.dc||'All')===c?' on':''),c);b.onclick=()=>{S.dc=c;showList()};cats.appendChild(b)});
    const s=(S.dq||'').toLowerCase();
    const f=list.filter(x=>(!S.dc||S.dc==='All'||(x.g||'General')===S.dc)&&(!s||(x.n+' '+(x.g||'')+' '+(x.x||'')).toLowerCase().includes(s))).sort((a,b)=>a.n.localeCompare(b.n,'en'));
    cnt.textContent=f.length+' of '+list.length+' documents';
    ul.innerHTML='';
    f.forEach(x=>{
      const li=el('li'),b=el('button','ditem'+(x.id===S.doc?' on':''));
      b.append(el('b','',x.n),el('span','muted',(x.g||'General')+(x.x?' · '+x.x:'')));
      if(!hasFile(x))b.appendChild(el('span','badge g','no file yet'));
      b.onclick=()=>{S.doc=x.id;store.set('biolab-doc',x.id);showList();showViewer()};
      li.appendChild(b);ul.appendChild(li);
    });
    if(!f.length)ul.appendChild(el('li','muted','Nothing found.'));
  }
  q.oninput=()=>{S.dq=q.value;showList()};
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=ul.querySelector('button');if(b)b.click()}});
  if(!list.some(x=>x.id===S.doc)){const sv=store.get('biolab-doc');S.doc=list.some(x=>x.id===sv)?sv:null}
  showList();showViewer();
}
addEventListener('keydown',e=>{
  if(e.key==='/'&&route()==='docs'&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){
    const q=document.querySelector('.doclist input');if(q){e.preventDefault();q.focus()}
  }
});

/* ================= MEMBERS (admin) ================= */
function members(v){
  if(!MEM.length)return v.appendChild(el('p','muted','No accounts yet.'));
  const tb=document.createElement('table'),hr=document.createElement('tr');
  ['Name','Username','Group','Comment','Registered','Status','Role','Actions'].forEach(l=>hr.appendChild(el('th','',l)));
  const th=document.createElement('thead');th.appendChild(hr);tb.appendChild(th);
  const bd=document.createElement('tbody');
  MEM.slice().sort((a,b)=>(b.at||0)-(a.at||0)).forEach(x=>{
    const tr=document.createElement('tr');
    [x.name,x.username,x.grp,x.note,dstr(x.at)].forEach(t=>tr.appendChild(el('td','',t||'')));
    const s=el('td');s.appendChild(el('span','badge '+(x.status==='approved'?'ok':x.status==='rejected'?'r':'y'),x.status==='approved'?'approved':x.status==='rejected'?'declined':'waiting'));tr.appendChild(s);
    tr.appendChild(el('td','',x.role==='admin'?'Administrator':'Member'));
    const a=el('td');
    if(x.id===ME.id)a.appendChild(el('span','muted','you'));
    else{
      const btn=(l,fn)=>{const b=el('button','gap',l);b.onclick=fn;a.appendChild(b)};
      if(x.status!=='approved')btn('Approve',()=>setMember(x.id,'status','approved'));
      if(x.status!=='rejected')btn(x.status==='approved'?'Revoke':'Decline',()=>setMember(x.id,'status','rejected'));
      if(x.status==='approved')btn(x.role==='admin'?'Remove admin':'Make admin',()=>setMember(x.id,'role',x.role==='admin'?'member':'admin'));
    }
    tr.appendChild(a);bd.appendChild(tr);
  });
  tb.appendChild(bd);v.appendChild(tb);
}
async function setMember(id,field,value){
  try{await api('POST','/api/members/'+encodeURIComponent(id)+'/'+field,{[field]:value});await refresh(true)}catch(e){alert(e.message)}
}

/* ================= RECORD EDITOR (admin) ================= */
let cur=null;
function openDlg(type,item){
  if(!ME.admin)return;
  cur={type,item};
  $('dt').textContent=(item?'Edit ':'New ')+({c:'chemical',b:'buffer',d:'document'})[type];
  const f=$('fields');f.innerHTML='';$('err').textContent='';
  SPEC[type].forEach(([k,l,t,o])=>{
    const lb=el('label','',l);lb.htmlFor='f_'+k;let i;
    if(t==='sel'){i=document.createElement('select');for(const x in o)i.append(new Option(o[x],x));i.value=item?item[k]:Object.keys(o)[0]}
    else if(t==='chk'){i=el('input');i.type='checkbox';i.checked=!!(item&&item[k]);lb.className='chk';lb.prepend(i);i.id='f_'+k;f.appendChild(lb);return}
    else{i=el('input');i.type=t;i.value=item?item[k]||'':'';if(t==='text')i.maxLength=k==='u'?400:120}
    i.id='f_'+k;f.append(lb,i);
  });
  $('del').style.display=item?'':'none';$('fresh').style.display=type==='b'?'':'none';
  $('dlg').showModal();$('f_n').focus();
}
async function commit(type,items){
  $('ok').disabled=$('del').disabled=true;
  try{
    await api('PUT','/api/inventory/'+({c:'chemicals',b:'buffers',d:'docs'})[type],{items});
    $('dlg').close();await refresh(true);
  }catch(e){$('err').textContent=e.message||'Could not save. Please try again.'}
  $('ok').disabled=$('del').disabled=false;
}
function saveDlg(){
  const{type,item}=cur,o=Object.assign({},item||{id:uid()});
  for(const[k,,t]of SPEC[type]){const i=$('f_'+k);o[k]=t==='chk'?i.checked:i.value.trim()}
  if(!o.n){$('err').textContent='Please enter a name.';return}
  if(type==='d'){
    if(o.u&&!docInfo(o.u)){$('err').textContent='Please paste a full https:// link (Google Drive works best) or a file path like pdf/name.pdf. You can also leave it empty for now.';return}
    if(!o.g)o.g='General';
  }
  const items=INV[type].slice(),ix=items.findIndex(x=>x.id===o.id);
  if(ix<0)items.push(o);else items[ix]=o;
  commit(type,items);
}
$('ok').onclick=saveDlg;
$('cancel').onclick=()=>$('dlg').close();
$('fresh').onclick=()=>{$('f_p').value=new Date().toISOString().slice(0,10)};
$('del').onclick=()=>{if(confirm('Delete “'+cur.item.n+'”?'))commit(cur.type,INV[cur.type].filter(x=>x.id!==cur.item.id))};
$('dlg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox')saveDlg()});

function copyCsv(){
  const b=S.tab==='b',rows=filt();
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const L=[(b?['Name','Volume','Date','Comment']:['Name','Amount','Location','Section','DANGER','Comment']).map(q).join(',')];
  rows.forEach(x=>L.push((b?[x.n,x.v,fmt(x.p),x.t]:[x.n,x.a,LOC[x.l],SEC[x.s],x.d?'yes':'',x.t]).map(q).join(',')));
  const txt=L.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('CSV copied: '+rows.length+' rows.'),()=>prompt('Copy the CSV manually:',txt));
}

/* ================= LOADING + SIGN OUT ================= */
async function loadMe(){
  const d=await api('GET','/api/me');
  ME={id:d.id||null,name:d.name||'',admin:d.role==='admin'&&d.status==='approved',approved:d.status==='approved',status:d.status||null,loaded:true};
}
async function refresh(force){
  try{
    await loadMe();
    let sig=JSON.stringify(ME);
    if(canRead()){
      const names=['chemicals','buffers','docs'],r=await Promise.all(names.map(n=>api('GET','/api/inventory/'+n)));
      INV.c=r[0].items;INV.b=r[1].items;INV.d=r[2].items;META={c:r[0].at,b:r[1].at,d:r[2].at};
      sig+=JSON.stringify([INV,META]);
      if(ME.admin){MEM=(await api('GET','/api/members')).members;sig+=JSON.stringify(MEM)}
    }else{INV={c:null,b:null,d:null};MEM=[]}
    STALE=false;
    if(force||sig!==SIG){SIG=sig;render()}
  }catch(e){
    if(!ME.loaded){STALE=true;render()}
  }
}
async function logout(){
  try{await api('POST','/api/logout',{})}catch(e){}
  location.hash='#home';SIG='';await refresh(true);
}
render();
refresh(true);
setInterval(()=>{if(!document.hidden)refresh(false)},12000);
</script>
